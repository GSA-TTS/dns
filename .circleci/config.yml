version: 2.1
orbs:
  tfsec: mycodeself/tfsec@1.1.0

executors:
  mise:
    docker:
      - image: ghcr.io/jdx/mise:2026.9.11-debian

commands:
  install-tools:
    steps:
      - run:
          name: Install pinned tools
          command: |
            mise trust
            mise install
            mise exec -- tofu version
            mise exec -- python --version

jobs:
  plan:
    executor: mise
    steps:
      - checkout
      - install-tools
      - run:
          name: Validate OpenTofu configuration
          command: |
            mise exec -- tofu fmt -check -recursive
            mise exec -- tofu -chdir=terraform/bootstrap init -backend=false -input=false -lockfile=readonly
            mise exec -- tofu -chdir=terraform/bootstrap validate
            if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
              mise exec -- tofu -chdir=terraform init -backend-config=backend.tfvars -input=false -lockfile=readonly
            else
              mise exec -- tofu -chdir=terraform init -backend=false -input=false -lockfile=readonly
            fi
            mise exec -- tofu -chdir=terraform validate
      - run:
          name: Create OpenTofu plan
          command: |
            mkdir -p workspace
            if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
              mise exec -- tofu -chdir=terraform plan -input=false -out=../workspace/tfplan
            else
              echo "AWS credentials are unavailable; skipping the remote-state plan."
              touch workspace/no-plan
            fi
      - persist_to_workspace:
          root: .
          paths:
            - workspace

  tfsec:
    executor: tfsec/default
    steps:
      - checkout
      - tfsec/scan:
          directory: .
          #exclude-checks: ''

  checkov:
    executor: mise
    steps:
      - checkout
      - install-tools
      - run:
          name: Install checkov
          command: mise exec -- python -m pip install checkov==3.3.22
      - run:
          name: Run checkov
          command: mise exec -- checkov -d ./terraform/ --skip-check CKV_AWS_18,CKV_AWS_40,CKV_AWS_144,CKV_AWS_273,CKV_AWS_289,CKV_AWS_290,CKV_AWS_355,CKV2_AWS_23,CKV2_AWS_39,CKV2_AWS_38,CKV2_AWS_62
          # Removed CKV2_AWS_61, CKV_AWS_145, CKV_AWS_18, CKV2_AWS_6 as those are now fixed

  apply:
    executor: mise
    steps:
      - checkout
      - install-tools
      - attach_workspace:
          at: .
      - run:
          name: Deploy the full environment
          command: |
            test -f workspace/tfplan
            mise exec -- tofu -chdir=terraform init -backend-config=backend.tfvars -input=false -lockfile=readonly
            mise exec -- tofu -chdir=terraform apply -input=false -auto-approve ../workspace/tfplan

  validate:
    executor: mise
    steps:
      - checkout
      - install-tools
      - run:
          name: Install dependencies
          command: mise exec -- python -m pip install -r requirements.txt
      - run:
          name: Run live DNS validations
          command: mise exec -- python -m pytest -m integration tests

  test:
    executor: mise
    steps:
      - checkout
      - install-tools
      - run:
          name: Install dependencies
          command: mise exec -- python -m pip install -r requirements.txt
      - run:
          name: Run offline tests
          command: mise exec -- python -m pytest -m "not integration" tests

workflows:
  version: 2

  validate_and_deploy:
    jobs:
      - plan
      - tfsec
      - checkov
      - test
      - apply:
          filters:
            branches:
              only: main
          requires:
            - plan
            - tfsec
            - checkov
            - test
            - validate
      - validate:
          filters:
            branches:
              only: main

experimental:
  notify:
    branches:
      only:
        - main
